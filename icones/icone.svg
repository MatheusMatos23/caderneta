<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Ícone da Caderneta: um caderninho com R$ -->
  <rect width="512" height="512" rx="92" fill="#1E6B3C"/>
  <rect x="136" y="80" width="244" height="352" rx="26" fill="#FFFFFF"/>
  <!-- furos da espiral -->
  <g fill="#1E6B3C">
    <circle cx="136" cy="140" r="15"/>
    <circle cx="136" cy="218" r="15"/>
    <circle cx="136" cy="296" r="15"/>
    <circle cx="136" cy="374" r="15"/>
  </g>
  <!-- linhas do caderno -->
