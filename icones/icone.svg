    <line x1="192" y1="152" x2="344" y2="152"/>
    <line x1="192" y1="206" x2="344" y2="206"/>
  </g>
  <!-- R$ -->
  <text x="268" y="386" text-anchor="middle" font-family="Arial, 'Segoe UI', sans-serif" font-size="132" font-weight="800" fill="#1E6B3C">R$</text>
